{% load static %}

<main class="contenedor">
    <form class="formulario" method="POST">
        {% csrf_token %}

        <h1>Solicitud de adopción</h1>
        <p class="descripcion">
            Completa tus datos para que podamos ponernos en contacto contigo.
        </p>
        <p class="nota">Todos los campos son obligatorios.</p>
        
        {% if mensaje_confirmacion %}
            <p class="mensaje">{{ mensaje_confirmacion }}</p>
        {% endif %}

        {% if redireccionar %}
            <script>
            // Espera 3 segundos y luego redirige al catálogo
                setTimeout(function() {
                    window.location.href = "{% url 'catalogo' %}";
                }, 3000);
            </script>
        {% endif %}

        <div class="campo">
            <label for="nombre">Nombre completo *</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                placeholder="Escribe tu nombre completo"
                value="{{ nombre|default:'' }}"
                pattern="[A-Za-zñÑáéíóúÁÉÍÓÚ\s]+"
                title="El nombre no puede tener números."
                required
                >
        </div>

        <div class="campo">
            <label for="telefono">Teléfono de contacto *</label>
            <input
                type="tel"
                id="telefono"
                name="telefono"
                placeholder="Ej. 310 000 0000"
                value="{{ telefono|default:'' }}"
                pattern="[0-9]+"
                title="El Teléfono no puede tener letras"
                required
            >
        </div>

        <div class="campo">
            <label for="correo">Correo electrónico *</label>
            <input
                type="email"
                id="correo"
                name="correo"
                placeholder="correo@ejemplo.com"
                required
            >
        </div>

        <div class="campo">
            <label for="mascota">Mascota de interés *</label>
            <select id="mascota" name="mascota" required>
                <option value="">Selecciona una mascota</option>
                {% for m in mascotas %}
                    <option value="{{ m.nombre }}" {% if mascota == m.nombre %}selected{% endif %}>
                        {{ m.nombre }} ({{ m.especie }})
                    </option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Enviar solicitud</button>
    </form>
</main>
